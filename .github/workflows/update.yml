name: Cập nhật dashboard Kindle

on:
  schedule:
    # Giờ trong cron là UTC (giờ VN = UTC + 7). GitHub có thể chạy trễ.
    # 8:00–23:45 giờ VN: 15 phút/lần (01:00–16:45 UTC)
    - cron: "*/15 1-16 * * *"
    # 0:00 và 4:00 giờ VN: 4 tiếng/lần (17:00, 21:00 UTC)
    - cron: "0 17,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Tải font Inter (nếu repo chưa có)
        continue-on-error: true
        run: |
          if [ ! -f fonts/Inter-Regular.otf ]; then
            mkdir -p fonts
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
            unzip -j -o /tmp/inter.zip 'extras/otf/Inter-Regular.otf' 'extras/otf/Inter-Medium.otf' 'extras/otf/Inter-SemiBold.otf' 'extras/otf/Inter-Bold.otf' -d fonts
          fi
          ls -la fonts
      - name: Vẽ dashboard
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DASH_SKIP_CALENDARS: ${{ vars.DASH_SKIP_CALENDARS }}
          DASH_LAYOUT: ${{ vars.DASH_LAYOUT || 'lich' }}   # lich (mặc định) / claude
          # Toạ độ thành phố cho thời tiết — sửa 2 số dưới (lấy từ Google Maps)
          DASH_LAT: "10.7769"
          DASH_LON: "106.7009"
          # Tiêu đề bố cục claude (tuỳ chọn)
          DASH_TITLE: "Claude"
          # Kích thước màn hình (điểm ảnh, chiều dọc).
          # iPad Air 1/2: 1536 x 2048 · iPad Air 10.9"/11": 1640 x 2360 · iPad Air 13": 2048 x 2732
          DASH_W: "1536"
          DASH_H: "2048"
          # Cỡ chữ: iPad nhiều điểm ảnh hơn Kindle nên cần số to hơn (Kindle 1.3 · Air 1/2 1.6 · Air 11" 1.75)
          DASH_SCALE: "1.6"
          DASH_FABLE_KEY: ${{ vars.DASH_FABLE_KEY }}
          SECRET_PATH: ${{ secrets.SECRET_PATH }}
        run: |
          python render.py --out "_site/${SECRET_PATH:-img}/dashboard.png"
          # trang iPad dạng web (tick được) + trang ảnh dự phòng, nằm cùng thư mục bí mật với ảnh.
          # Điền link Apps Script (bỏ phần ?token=...), toạ độ và lịch cần ẩn vào trang. Token KHÔNG được ghi vào.
          python - <<'PY'
          import json, os
          sp = os.environ.get("SECRET_PATH") or "img"
          api = (os.environ.get("DATA_URL") or "").split("?")[0]
          skip = [s.strip() for s in (os.environ.get("DASH_SKIP_CALENDARS") or "").split(",") if s.strip()]
          html = open("ipad/index.html", encoding="utf-8").read()
          html = (html.replace("__API__", api).replace("__LAT__", os.environ["DASH_LAT"])
                      .replace("__LON__", os.environ["DASH_LON"])
                      .replace("__SKIP__", json.dumps(skip, ensure_ascii=False).replace("\\", "\\\\").replace("'", "\\'")))
          open(f"_site/{sp}/index.html", "w", encoding="utf-8").write(html)
          PY
          cp ipad/anh.html "_site/${SECRET_PATH:-img}/anh.html"
          touch _site/index.html
          # ảnh mẫu (dữ liệu giả) để minh hoạ, ai cũng xem được
          python render.py --sample sample.json --now "2026-11-06T10:30" --out _site/preview.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
